name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so changes in Home Assistant or HACS rules are noticed.
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hassfest:
    name: Home Assistant manifest and translations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS repository rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: hacs/action@main
        with:
          category: integration
