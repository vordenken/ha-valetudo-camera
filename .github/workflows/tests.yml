name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3

      # The stream tests transcode a generated clip with a real ffmpeg.
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg

      - name: Install test dependencies
        run: |
          uv venv --python 3.14
          uv pip install -r requirements_test.txt

      - name: Lint
        run: |
          .venv/bin/ruff check custom_components tests
          .venv/bin/ruff format --check custom_components tests

      - name: Test
        run: .venv/bin/python -m pytest --timeout=120 --cov=custom_components.valetudo_camera --cov-branch --cov-report=term-missing --cov-fail-under=80
